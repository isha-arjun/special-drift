<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>My Finance</title>
<style>

tion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.bar{height:9px;background:#263653;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#728fff,#54d6a0);border-radius:99px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #263653}.row:last-child{border:0}.pill{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b1323;color:var(--text);padding:11px}input:focus,select:focus,textarea:focus{outline:2px solid #7895ff55;border-color:var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.empty{padding:24px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border:1px solid #42577b;background:#15223b;border-radius:12px;color:#c9d7f3;font-size:13px;line-height:1.5}.notice.warn{border-color:#745c32;background:#2b2416}.notice.good{border-color:#28634f;background:#10271f}.hidden{display:none!important}.mobilebar{display:none}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.subnav button{font-size:12px}.dangertext{color:var(--red)}.positive{color:var(--green)}.modalback{position:fixed;inset:0;background:#020611cc;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(520px,100%);background:#121d32;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 80px #0009}.modal h2{margin-top:0}.modal .actions{justify-content:flex-end}.footer{margin-top:30px;color:var(--muted);font-size:11px}
@media(max-width:900px){.shell{display:block}.side{display:none}.mobilebar{display:flex;position:sticky;top:0;z-index:3;background:#0b1221ed;border-bottom:1px solid var(--line);overflow:auto;padding:8px;gap:6px}.mobilebar button{white-space:nowrap;font-size:12px;padding:9px 11px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span3,.span4{grid-column:span 2}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:span 1}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.title{font-size:24px}.metric{font-size:23px}}
</style></head><body>
<div class="mobilebar" id="mobileNav"></div><div class="shell"><aside class="side"><div class="brand">MY <span>FINANCE</span></div><nav id="nav"></nav><div class="footer">Private by design · Stored on this device</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">PERSONAL FINANCE</div><div class="title" id="pageTitle">Overview</div><div class="small" id="monthLabel"></div></div><div class="pill">INR · DARK</div></header><div id="content"></div><div class="footer">My Finance · Device-local recordkeeping. Not an investment service.</div></main></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';
const sections=['Overview','Allocations','Transactions','Assets','MacCompat','Future Ventures','Education','Goals','Reports','Settings'];
const alloc=[['Protected savings',50],['MacCompat reinvestment',10],['Personal spending',10],['Assets',5],['Future ventures',10],['Education',5],['Giving & experiences',5],['Flexibility fund',5]];
const subs={'Protected savings':['Protected savings'],'MacCompat reinvestment':['Growth','Product quality','Operations & reliability'],'Personal spending':['AI tool subscriptions','Friends/social','School treats','Personal purchases'],'Assets':['Index fund reserve','Productive equipment','Digital assets','Knowledge assets','Other opportunities'],'Future ventures':['Arduino hardware prototype','Future startup capital','Small experiments','Opportunity reserve'],'Education':['Udacity / structured courses','Technical learning','Business / finance','Formal learning / certifications'],'Giving & experiences':['Family rent contribution','Family & friends','Charity / community','Experiences'],'Flexibility fund':['Rollover reserve']};
const defaults=()=>({version:1,settings:{monthlyTarget:200000},income:[],expenses:[],assets:[],subscriptions:[],goals:[{name:'Arduino prototype fund',target:0,saved:0},{name:'Udacity learning path',target:0,saved:0},{name:'Optional family-support reserve',target:0,saved:0},{name:'Asset plan',target:0,saved:0}],ventures:[{name:'Arduino hardware prototype',target:0,saved:0}],emergency:[],createdAt:new Date().toISOString()});
let state=defaults(),page='Overview',db=null;
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0), monthNow=()=>new Date().toISOString().slice(0,7), monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idb=()=>new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('IndexedDB unavailable'));let req=indexedDB.open('my-finance-local',1);req.onupgradeneeded=()=>req.result.createObjectStore('records');req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)});
async function persist(next){try{if(!db)await idb();await new Promise((res,rej)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(next,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}catch(e){try{localStorage.setItem('my-finance-state',JSON.stringify(next))}catch(_){throw Error('Could not save data on this device. Export a backup and free browser storage.')}}state=next;render()}
async function load(){try{await idb();let v=await new Promise((res,rej)=>{let r=db.transaction('records').objectStore('records').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)state=v;else{let l=localStorage.getItem('my-finance-state');if(l)state=JSON.parse(l)}}catch(e){let l=localStorage.getItem('my-finance-state');if(l)try{state=JSON.parse(l)}catch(_){}}render()}
const total=a=>a.reduce((s,x)=>s+(Number(x.amount)||0),0), current=m=>state.income.filter(x=>x.date.slice(0,7)===m), expenses=m=>state.expenses.filter(x=>x.date.slice(0,7)===m), incomeTotal=m=>total(current(m)), expenseTotal=m=>total(expenses(m)), spentCat=(cat,m)=>total(expenses(m).filter(x=>x.category===cat)), allocAmt=(cat,m)=>incomeTotal(m)*((alloc.find(x=>x[0]===cat)||[0,0])[1]/100);
function nav(){let html=sections.map(s=>'<button data-page="'+s+'" class="'+(s===page?'active':'')+'">'+s+'</button>').join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function card(label,value,sub=''){return '<div class="card"><div class="small">'+label+'</div><div class="metric">'+value+'</div><div class="small">'+sub+'</div></div>'}
function table(rows,heads){return '<div class="tablewrap"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+heads.length+'" class="empty">No records yet</td></tr>')+'</tbody></table></div>'}
function overview(){let m=monthNow(),inc=incomeTotal(m),exp=expenseTotal(m),protectedAmt=inc*.5,nonSavings=inc*.5,remaining=Math.max(0,nonSavings-exp);return '<div class="grid">'+card('Income this month',money(inc),'Recorded income')+card('Expenses this month',money(exp),'Recorded expenses')+card('Protected savings · 50%',money(protectedAmt),'Locked allocation rule')+card('Non-savings budget remaining',money(remaining),'After recorded expenses')+'<div class="card span2"><div class="section-head"><h3>Monthly allocation</h3><span class="pill">'+monthName(m)+'</span></div>'+alloc.map(([n,p])=>'<div class="row"><span>'+n+'</span><b>'+money(inc*p/100)+'</b></div>').join('')+'</div><div class="card span2"><h3>Quick entry</h3><div class="actions"><button class="primary" data-page="Transactions">Add transaction</button><button data-page="Allocations">View allocations</button><button data-page="Settings">Backup & settings</button></div><p class="small">Income target: '+money(state.settings.monthlyTarget)+' / month. Your records stay in this browser on this device.</p></div></div>'}
function allocations(){let m=monthNow(),inc=incomeTotal(m);return '<div class="notice">50% of recorded income is protected savings. The allocation percentages are fixed to the original plan and total 100%.</div><div class="grid section">'+alloc.map(([n,p])=>'<div class="card"><div class="row"><b>'+n+'</b><span class="pill">'+p+'%</span></div><div class="metric">'+money(inc*p/100)+'</div><div class="bar"><i style="width:'+p*2+'%"></i></div><div class="small">Spent this month: '+money(spentCat(n,m))+'</div>'+(subs[n]||[]).map(s=>'<div class="row small"><span>'+s+'</span><span>'+money(inc*p/100/(subs[n].length||1))+'</span></div>').join('')+'</div>').join('')+'</div>'}
function transactions(){let m=monthNow(),rows=[...state.income.map(x=>({...x,type:'Income'})),...state.expenses.map(x=>({...x,type:'Expense'}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+x.type+'</td><td>'+esc(x.category||x.source||'—')+'</td><td>'+esc(x.note||'—')+'</td><td>'+money(x.amount)+'</td></tr>');return '<div class="grid"><div class="card span2"><h3>Add income</h3><form id="incomeForm" class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" required value="'+monthNow()+'-15"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Source / description</label><input name="source" placeholder="Payment, allowance..." required></div><div class="field"><label>Note (optional)</label><input name="note"></div><div class="actions span2"><button class="primary">Save income</button></div></form><p class="small">Enter either a monthly total or individual payments for a month, not both.</p></div><div class="card span2"><h3>Add expense</h3><form id="expenseForm" class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" required value="'+monthNow()+'-15"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Allocation category</label><select name="category">'+alloc.map(x=>'<option>'+x[0]+'</option>').join('')+'</select></div><div class="field"><label>Subcategory</label><select name="subcategory">'+Object.values(subs).flat().map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field span2"><label>Description</label><input name="note" placeholder="What was this expense for?"></div><div class="actions span2"><button class="primary">Save expense</button></div></form></div><div class="card span4"><div class="section-head"><h3>All transactions</h3><span class="pill">'+state.income.length+' income · '+state.expenses.length+' expenses</span></div>'+table(rows,['Date','Type','Category / source','Note','Amount'])+'</div></div>'}
function assets(){return '<div class="grid"><div class="card span2"><h3>Add asset / holding</h3><form id="assetForm" class="formgrid"><div class="field"><label>Name</label><input name="name" required placeholder="Index fund reserve, equipment..."></div><div class="field"><label>Type</label><select name="type"><option>Index tracker</option><option>Equipment</option><option>Digital asset</option><option>Knowledge asset</option><option>Other</option></select></div><div class="field"><label>Contributed value (₹)</label><input name="contributed" type="number" min="0" value="0"></div><div class="field"><label>Current value (₹)</label><input name="value" type="number" min="0" value="0"></div><div class="actions span2"><button class="primary">Add asset</button></div></form></div><div class="card span2"><h3>Portfolio overview</h3><div class="metric">'+money(total(state.assets.map(a=>({amount:a.value}))))+'</div><div class="small">Manually entered current value · tracker only, not investment execution</div></div><div class="card span4">'+table(state.assets.map(a=>'<tr><td>'+esc(a.name)+'</td><td>'+esc(a.type)+'</td><td>'+money(a.contributed)+'</td><td>'+money(a.value)+'</td></tr>'),['Asset','Type','Contributed','Current value'])+'</div></div>'}
function mac(){let m=monthNow(),amt=allocAmt('MacCompat reinvestment',m);return '<div class="grid"><div class="card span2"><h3>MacCompat reinvestment</h3><div class="metric">'+money(amt)+'</div><div class="small">10% of recorded income</div></div><div class="card span2"><h3>Allocation split</h3><div class="row"><span>Growth · marketing 25%, research 10%</span><b>35%</b></div><div class="row"><span>Product quality · development 25%, security/testing 15%</span><b>40%</b></div><div class="row"><span>Operations & reliability</span><b>25%</b></div></div><div class="card span4"><h3>Record reinvestment expense</h3><form id="macForm" class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" required value="'+monthNow()+'-15"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Purpose</label><select name="subcategory"><option>Marketing</option><option>Catalogue / research</option><option>Product development</option><option>Security / testing</option><option>Infrastructure</option><option>Operations / support</option><option>Reliability / maintenance</option></select></div><div class="field"><label>Note</label><input name="note"></div><div class="actions span2"><button class="primary">Record reinvestment</button></div></form></div></div>'}
function future(){return '<div class="grid"><div class="card span2"><h3>New venture goal</h3><form id="ventureForm" class="formgrid"><div class="field"><label>Project</label><input name="name" required placeholder="Prototype or startup"></div><div class="field"><label>Target (₹)</label><input name="target" type="number" min="0" value="0"></div><div class="actions span2"><button class="primary">Add goal</button></div></form></div><div class="card span2"><h3>Allocation</h3><div class="metric">'+money(allocAmt('Future ventures',monthNow()))+'</div><div class="small">10% of recorded income</div></div><div class="card span4">'+table(state.ventures.map(v=>'<tr><td>'+esc(v.name)+'</td><td>'+money(v.saved)+'</td><td>'+money(v.target)+'</td><td>'+Math.min(100,v.target?Math.round(v.saved/v.target*100):0)+'%</td></tr>'),['Project','Saved','Target','Progress'])+'</div></div>'}
function education(){return '<div class="grid"><div class="card span2"><h3>Education allocation</h3><div class="metric">'+money(allocAmt('Education',monthNow()))+'</div><div class="small">5% of recorded income</div></div><div class="card span2"><h3>Add subscription</h3><form id="subForm" class="formgrid"><div class="field"><label>Service</label><input name="name" required placeholder="Course or learning tool"></div><div class="field"><label>Cost (₹)</label><input name="cost" type="number" min="0" required></div><div class="field"><label>Billing cadence</label><select name="cadence"><option>Monthly</option><option>Annual</option><option>One-time</option></select></div><div class="field"><label>Renewal date</label><input name="renewal" type="date"></div><div class="actions span2"><button class="primary">Add subscription</button></div></form></div><div class="card span4">'+table(state.subscriptions.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+money(s.cost)+'</td><td>'+esc(s.cadence)+'</td><td>'+esc(s.renewal||'—')+'</td></tr>'),['Service','Cost','Cadence','Renewal'])+'</div></div>'}
function goals(){return '<div class="grid">'+state.goals.map((g,i)=>'<div class="card"><h3>'+esc(g.name)+'</h3><div class="metric">'+money(g.saved)+'</div><div class="small">Target '+money(g.target)+'</div><div class="bar"><i style="width:'+Math.min(100,g.target?g.saved/g.target*100:0)+'%"></i></div><button data-goal="'+i+'">Edit target / saved</button></div>').join('')+'<div class="card span4"><div class="notice">For actual investment accounts or financial arrangements, involve a parent or guardian. This dashboard is for planning and recordkeeping only.</div></div></div>'}
function reports(){let m=monthNow(),inc=incomeTotal(m),exp=expenseTotal(m);return '<div class="grid"><div class="card span2"><h3>Monthly summary · '+monthName(m)+'</h3><div class="row"><span>Income</span><b>'+money(inc)+'</b></div><div class="row"><span>Expenses</span><b>'+money(exp)+'</b></div><div class="row"><span>Protected savings allocation</span><b>'+money(inc*.5)+'</b></div><div class="row"><span>Non-savings remainder</span><b>'+money(Math.max(0,inc*.5-exp))+'</b></div></div><div class="card span2"><h3>Exports</h3><div class="actions"><button id="csvBtn">Export transactions CSV</button><button onclick="window.print()">Print / save PDF</button></div></div></div>'}
function settings(){return '<div class="grid"><div class="card span2"><h3>Preferences</h3><form id="settingsForm" class="formgrid"><div class="field span2"><label>Monthly personal income target (₹)</label><input name="monthlyTarget" type="number" min="0" value="'+state.settings.monthlyTarget+'"></div><div class="actions span2"><button class="primary">Save settings</button></div></form><p class="small">Income basis: personal income after business expenses and tax reserves.</p></div><div class="card span2"><h3>Data & backup</h3><div class="notice good">Your finance records stay on this device. Backups are encrypted locally before download. No financial records are uploaded to GitHub or Vercel.</div><div class="actions"><button class="primary" id="exportBackup">Export Backup</button><button id="uploadBackup">Upload Backup</button><input class="hidden" type="file" id="backupFile" accept=".backup,application/json"></div><p class="small">Use Upload Backup to restore a previously exported .backup file. You will need its passphrase. Restoring replaces the current dataset only after validation and confirmation.</p><div class="notice warn">Clearing Safari website data may erase local records. Use normal Safari, not Private Browsing, and keep encrypted backups somewhere safe. Passphrases cannot be recovered.</div></div><div class="card span4"><h3>Privacy & storage</h3><div class="row"><span>Storage</span><b>IndexedDB / local fallback</b></div><div class="row"><span>Family access</span><b>No</b></div><div class="row"><span>Cloud sync</span><b>No</b></div><div class="row"><span>Opening balances</span><b>₹0</b></div></div></div>'}
function render(){nav();$('#pageTitle').textContent=page;$('#monthLabel').textContent=monthName(monthNow());let views={Overview:overview,Allocations:allocations,Transactions:transactions,Assets:assets,MacCompat:mac,'Future Ventures':future,Education:education,Goals:goals,Reports:reports,Settings:settings};$('#content').innerHTML=views[page]();wire()}
function wire(){const form=(id,fn)=>{let f=$('#'+id);if(f)f.onsubmit=async e=>{e.preventDefault();await fn(Object.fromEntries(new FormData(f)));}};form('incomeForm',async v=>{state.income.push({...v,amount:Number(v.amount)});await persist(state)});form('expenseForm',async v=>{state.expenses.push({...v,amount:Number(v.amount)});await persist(state)});form('assetForm',async v=>{state.assets.push({...v,contributed:Number(v.contributed),value:Number(v.value)});await persist(state)});form('macForm',async v=>{state.expenses.push({...v,category:'MacCompat reinvestment',amount:Number(v.amount)});await persist(state)});form('ventureForm',async v=>{state.ventures.push({...v,target:Number(v.target),saved:0});await persist(state)});form('subForm',async v=>{state.subscriptions.push({...v,cost:Number(v.cost)});await persist(state)});form('settingsForm',async v=>{state.settings.monthlyTarget=Number(v.monthlyTarget);await persist(state)});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.goal),g=state.goals[i];modal('<h2>Edit goal</h2><div class="field"><label>Target (₹)</label><input id="goalTarget" type="number" value="'+g.target+'"></div><div class="field"><label>Saved (₹)</label><input id="goalSaved" type="number" value="'+g.saved+'"></div>',async()=>{g.target=Number($('#goalTarget').value);g.saved=Number($('#goalSaved').value);await persist(state)})});let ex=$('#exportBackup');if(ex)ex.onclick=exportBackup;let up=$('#uploadBackup');if(up)up.onclick=()=>$('#backupFile').click();let fi=$('#backupFile');if(fi)fi.onchange=()=>{if(fi.files[0])importBackup(fi.files[0]);fi.value=''};let csv=$('#csvBtn');if(csv)csv.onclick=exportCSV}
